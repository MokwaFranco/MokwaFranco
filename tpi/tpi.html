<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverso de Personajes</title>
</head>
<body>
    <h1>Multiverso de Personajes</h1>

    <input id="campo-busqueda" type="text">

    <button id="boton-busqueda">Buscar</button>

    <select id="menu-datos">
        <option value="opcion-rm">Rick and Morty</option>
        <option value="opcion-simpson">Los Simpson</option>
        <option value="opcion-ambas">Ambas</option>
    </select>

    <select id="menu-estados">
        <option value="opcion-vivos">Vivos</option>
        <option value="opcion-muertos">Muertos</option>
        <option value="opcion-desconocidos">Desconocidos</option>
    </select>

    <select id="menu-orden">
        <option value="opcion-ascendente">Ascendente</option>
        <option value="opcion-descendente">Descendente</option>
    </select>

    <div id="contenedor-resultados"></div>
    <div id="contenedor-estadisticas"></div>
    <div id="contenedor-favoritos"></div>

    <script src="/tpi/tpi.js"></script>

</html>
